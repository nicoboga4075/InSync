# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [lts/iron, lts/jod, lts/krypton] # 20.20.2 (2026-03-24, end of life, backward compatibility), 22.23.3 (2026-09-23), 24.22.0 (2026-10-14)
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run build
    - run: npm test

  # Coverage once, on the Node.js of .nvmrc, reported in the job summary and uploaded to Codecov
  coverage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - name: Run tests with coverage
      run: |
        npm run test:coverage
        {
          echo '## Coverage'
          echo '```'
          npm run --silent coverage:report
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage/lcov.info
        use_oidc: true
        fail_ci_if_error: false
