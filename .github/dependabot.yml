version: 2
updates:
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "daily"
    # The gitmoji of a dependency upgrade, as every commit of CLAUDE.md: the pull request titles are built from the commit message, so they get it too
    commit-message:
      prefix: "⬆️"
